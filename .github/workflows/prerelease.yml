name: 'Prerelease'

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    uses: DEFRA/lis-github-actions/.github/workflows/version.yml@v0
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      release-type: prerelease

  validate:
    name: 'Validate'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/node-service-validate.yml@v0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
      smoke-port: '3102'
      smoke-env: |
        HUB_JWT_SECRET=ci-smoke-test-hub-jwt-secret-0123456789
        SESSION_COOKIE_PASSWORD=ci-smoke-test-session-cookie-password-0123456789

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: [get-version, validate]
    uses: DEFRA/lis-github-actions/.github/workflows/node-sonar.yml@v0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
    secrets: inherit

  create-tag:
    name: 'Tag Validated Commit'
    needs: [get-version, validate, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    uses: DEFRA/lis-github-actions/.github/workflows/tag.yml@v0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
    secrets: inherit
